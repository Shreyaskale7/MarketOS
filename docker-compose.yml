version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: marketos
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: marketos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://marketos:secretpassword@db:5432/marketos_db
      - JWT_SECRET=your_super_secret_production_key_here
      - AUTO_BOOTSTRAP=true
      - LOG_LEVEL=INFO
    depends_on:
      - db

volumes:
  pgdata:
